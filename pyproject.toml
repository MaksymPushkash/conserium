[project]
name = "conserium"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "authlib>=1.7.0",
    "bcrypt>=5.0.0",
    "boto3>=1.35.0",
    "celery>=5.6.3",
    "fastapi>=0.136.1",
    "greenlet>=3.4.0",
    "httptools>=0.7.1",
    "langgraph>=1.1.10",
    "openai>=2.32.0",
    "pillow>=11.3.0",
    "pdfplumber>=0.11.9",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.0",
    "pydantic[email]>=2.13.3",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "pytesseract>=0.3.13",
    "httpx>=0.28.1",
    "redis>=7.4.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
    "trafilatura>=2.0.0",
    "uvicorn>=0.46.0",
    "uvloop>=0.22.1",
    "youtube-transcript-api>=1.2.3",
]

[project.optional-dependencies]
reranker = [
    "sentence-transformers>=5.4.1",
]
eval = [
    "datasets>=4.4.1",
    "ragas>=0.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]


[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "C4", "SIM", "TCH"]
ignore = ["E501", "B008", "TC001", "TC002", "TC003", "UP037"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"



[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false




[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
