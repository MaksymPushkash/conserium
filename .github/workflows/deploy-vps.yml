name: Deploy VPS

on:
  workflow_run:
    workflows:
      - Eval Regression
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/conserium' }}
      DEPLOY_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
      PRODUCTION_API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
      LIVE_EVAL_EMAIL: ${{ secrets.LIVE_EVAL_EMAIL }}
      LIVE_EVAL_PASSWORD: ${{ secrets.LIVE_EVAL_PASSWORD }}
      LIVE_EVAL_CREATE_USER: ${{ vars.LIVE_EVAL_CREATE_USER || 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment configuration
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PORT"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_APP_DIR"
          test -n "$DEPLOY_REF"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Capture current VPS revision
        run: |
          previous_ref="$(ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && git rev-parse HEAD")"
          echo "PREVIOUS_DEPLOY_REF=${previous_ref}" >> "$GITHUB_ENV"
          echo "Current VPS revision: ${previous_ref}"

      - name: Deploy on VPS
        run: |
          echo "Deploying candidate revision ${DEPLOY_REF}. This workflow is deploy-then-validate; a failed live validation may briefly expose the candidate before rollback."
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "DEPLOY_REF='$DEPLOY_REF' VPS_APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail

          cd "$VPS_APP_DIR"

          git fetch origin main
          git checkout main
          git reset --hard "$DEPLOY_REF"

          docker compose --env-file .env.prod up -d --build --remove-orphans
          docker compose --env-file .env.prod exec -T app uv run alembic upgrade head
          docker compose --env-file .env.prod ps
          curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null
          REMOTE_DEPLOY
          echo "Candidate deployed: ${DEPLOY_REF}"

      - name: Wait for public production API
        if: ${{ env.PRODUCTION_API_BASE_URL != '' }}
        run: |
          api_base="${PRODUCTION_API_BASE_URL%/}"
          api_base="${api_base%/api/v1}"
          api_host="$(python3 -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ["PRODUCTION_API_BASE_URL"]).hostname or "")')"
          echo "Checking public API health at ${api_base}/health"
          echo "Public API host resolves to:"
          getent hosts "$api_host" || true

          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --location --output /tmp/conserium-health-body --write-out '%{http_code}' "${api_base}/health" || true)"
            body="$(head -c 300 /tmp/conserium-health-body 2>/dev/null || true)"
            if [ "$status" = "200" ] && printf '%s' "$body" | grep -q '"status"'; then
              echo "Public API is healthy."
              exit 0
            fi
            echo "Public API not ready yet: attempt=${attempt} status=${status} body=${body}"
            sleep 5
          done

          echo "Public API did not become healthy. Collecting VPS diagnostics."
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "VPS_APP_DIR='$VPS_APP_DIR' API_HOST='$api_host' bash -s" <<'REMOTE_DIAGNOSTICS'
          set -euo pipefail
          cd "$VPS_APP_DIR"
          docker compose --env-file .env.prod ps
          docker compose --env-file .env.prod port app 8000 || true
          docker compose --env-file .env.prod logs --tail=120 app
          ss -ltnp | grep ':8000' || true
          curl --fail --silent --show-error http://127.0.0.1:8000/health || true
          if [ -n "${API_HOST:-}" ]; then
            curl --verbose --resolve "${API_HOST}:443:127.0.0.1" "https://${API_HOST}/health" || true
          fi
          sudo -n tail -n 120 /var/log/nginx/error.log || true
          REMOTE_DIAGNOSTICS
          exit 1

      - name: Run live production retrieval validation
        timeout-minutes: 12
        run: |
          if [ -z "${PRODUCTION_API_BASE_URL:-}" ] || [ -z "${LIVE_EVAL_EMAIL:-}" ] || [ -z "${LIVE_EVAL_PASSWORD:-}" ]; then
            echo "Skipping live retrieval validation because PRODUCTION_API_BASE_URL, LIVE_EVAL_EMAIL, or LIVE_EVAL_PASSWORD is not configured."
            exit 0
          fi

          echo "Validation started for candidate revision ${DEPLOY_REF}."

          create_user_flag=""
          if [ "$LIVE_EVAL_CREATE_USER" = "true" ]; then
            create_user_flag="--create-user"
          fi

          python3 scripts/run_live_eval.py \
            --base-url "$PRODUCTION_API_BASE_URL" \
            --email "$LIVE_EVAL_EMAIL" \
            --password "$LIVE_EVAL_PASSWORD" \
            --dataset evals/live/seed.json \
            --output artifacts/live-retrieval-eval-report.json \
            --min-collection-scope 1.0 \
            --min-noise-rejection 1.0 \
            --min-abstention-rate 1.0 \
            --wait-timeout-seconds 120 \
            $create_user_flag

      - name: Mark candidate revision validated
        run: |
          echo "Live validation passed. Candidate revision ${DEPLOY_REF} is now the active production revision."

      - name: Collect live eval failure diagnostics
        if: ${{ failure() && env.PRODUCTION_API_BASE_URL != '' }}
        run: |
          echo "Validation failed for candidate revision ${DEPLOY_REF}. Collecting diagnostics before rollback."
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "VPS_APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE_LIVE_EVAL_DIAGNOSTICS'
          set -euo pipefail
          cd "$VPS_APP_DIR"

          echo "=== docker compose ps ==="
          docker compose --env-file .env.prod ps || true

          echo "=== rabbitmq queues ==="
          docker compose --env-file .env.prod exec -T rabbitmq rabbitmqctl list_queues name messages messages_ready messages_unacknowledged || true

          echo "=== app logs ==="
          docker compose --env-file .env.prod logs --tail=160 app || true

          echo "=== worker-default logs ==="
          docker compose --env-file .env.prod logs --tail=220 worker-default || true

          echo "=== worker-embeddings logs ==="
          docker compose --env-file .env.prod logs --tail=220 worker-embeddings || true

          echo "=== worker-media logs ==="
          docker compose --env-file .env.prod logs --tail=220 worker-media || true
          REMOTE_LIVE_EVAL_DIAGNOSTICS

      - name: Roll back VPS deployment
        if: ${{ failure() && env.PREVIOUS_DEPLOY_REF != '' }}
        run: |
          echo "Rollback started. Candidate revision ${DEPLOY_REF} failed validation; restoring ${PREVIOUS_DEPLOY_REF}."
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "PREVIOUS_DEPLOY_REF='$PREVIOUS_DEPLOY_REF' VPS_APP_DIR='$VPS_APP_DIR' PRODUCTION_API_BASE_URL='$PRODUCTION_API_BASE_URL' bash -s" <<'REMOTE_ROLLBACK'
          set -euo pipefail
          cd "$VPS_APP_DIR"

          echo "Live validation failed. Restoring previous production revision; database downgrades are intentionally not executed automatically."
          echo "Rolling back to ${PREVIOUS_DEPLOY_REF}"
          git fetch origin main
          git reset --hard "$PREVIOUS_DEPLOY_REF"
          docker compose --env-file .env.prod up -d --build --remove-orphans
          docker compose --env-file .env.prod ps
          curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null
          if [ -n "${PRODUCTION_API_BASE_URL:-}" ]; then
            public_health="${PRODUCTION_API_BASE_URL%/}"
            public_health="${public_health%/api/v1}/health"
            public_health_ready="false"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error "$public_health" >/dev/null; then
                echo "Rollback public health check passed."
                public_health_ready="true"
                break
              fi
              echo "Rollback public health not ready: attempt=${attempt}"
              sleep 5
            done
            test "$public_health_ready" = "true"
          fi
          current_ref="$(git rev-parse HEAD)"
          echo "Rollback completed."
          echo "Current revision after rollback: ${current_ref}"
          test "$current_ref" = "$PREVIOUS_DEPLOY_REF"
          REMOTE_ROLLBACK

      - name: Upload live retrieval validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-retrieval-eval-report
          path: artifacts/live-retrieval-eval-report.json
          if-no-files-found: warn
