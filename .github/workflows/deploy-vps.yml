name: Deploy VPS

on:
  workflow_run:
    workflows:
      - Eval Regression
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/cortex' }}
      DEPLOY_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
      PRODUCTION_API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
      LIVE_EVAL_EMAIL: ${{ secrets.LIVE_EVAL_EMAIL }}
      LIVE_EVAL_PASSWORD: ${{ secrets.LIVE_EVAL_PASSWORD }}
      LIVE_EVAL_CREATE_USER: ${{ vars.LIVE_EVAL_CREATE_USER || 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment configuration
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PORT"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_APP_DIR"
          test -n "$DEPLOY_REF"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "DEPLOY_REF='$DEPLOY_REF' VPS_APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail

          cd "$VPS_APP_DIR"

          git fetch origin main
          git checkout main
          git reset --hard "$DEPLOY_REF"

          docker compose --env-file .env.prod up -d --build --remove-orphans
          docker compose --env-file .env.prod exec -T app uv run alembic upgrade head
          docker compose --env-file .env.prod ps
          curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null
          REMOTE_DEPLOY

      - name: Run live production retrieval validation
        run: |
          if [ -z "${PRODUCTION_API_BASE_URL:-}" ] || [ -z "${LIVE_EVAL_EMAIL:-}" ] || [ -z "${LIVE_EVAL_PASSWORD:-}" ]; then
            echo "Skipping live retrieval validation because PRODUCTION_API_BASE_URL, LIVE_EVAL_EMAIL, or LIVE_EVAL_PASSWORD is not configured."
            exit 0
          fi

          create_user_flag=""
          if [ "$LIVE_EVAL_CREATE_USER" = "true" ]; then
            create_user_flag="--create-user"
          fi

          python3 scripts/run_live_eval.py \
            --base-url "$PRODUCTION_API_BASE_URL" \
            --email "$LIVE_EVAL_EMAIL" \
            --password "$LIVE_EVAL_PASSWORD" \
            --dataset evals/live/seed.json \
            --output artifacts/live-retrieval-eval-report.json \
            $create_user_flag

      - name: Upload live retrieval validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-retrieval-eval-report
          path: artifacts/live-retrieval-eval-report.json
          if-no-files-found: warn
